# ===================================
# Novel Insight - Spring Boot 설정 파일
# ===================================
# 환경변수를 사용하여 민감 정보를 분리합니다
# ${ENV_VAR:기본값} 형식으로 환경변수를 참조합니다
# ===================================

spring:
  application:
    name: novel-insight

  # ===================================
  # 데이터베이스 설정
  # ===================================
  datasource:
    # [중요] 환경변수로 주입받습니다 (기본값: localhost)
    # 로컬 개발: jdbc:mysql://localhost:3306/novel_insight
    # Docker: jdbc:mysql://novel-mysql:3306/novel_insight
    url: ${DB_URL:jdbc:mysql://localhost:3306/novel_insight?useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
    # [보안] 민감 정보는 환경변수로 주입받습니다
    # .env 파일이나 시스템 환경변수에서 설정하세요
    username: ${DB_USERNAME:novel_user}
    password: ${DB_PASSWORD:password}

  # ===================================
  # JPA 설정
  # ===================================
  jpa:
    # SQL 콘솔 출력 (개발용)
    # 프로덕션 환경에서는 false로 설정하세요
    show-sql: ${SHOW_SQL:true}
    
    properties:
      hibernate:
        # SQL 포맷팅 (가독성 향상)
        format_sql: true
        
        # N+1 문제 해결: 기본 배치 사이즈
        # 한 번의 IN 쿼리로 N개의 연관 엔티티를 가져옴
        default_batch_fetch_size: 100
    
    hibernate:
      # ddl-auto 설정
      # - update: Entity 변경 시 자동 반영 (개발용)
      # - validate: Entity와 DB 스키마 검증만 (운영용 권장)
      # - none: 아무것도 하지 않음 (운영용)
      ddl-auto: ${DDL_AUTO:update}

  # ===================================
  # Spring Batch 설정
  # ===================================
  batch:
    jdbc:
      # Batch 메타 테이블 자동 생성
      initialize-schema: always
    
    job:
      # 서버 시작 시 Job 자동 실행 여부
      # false: 수동으로 Job을 트리거해야 함
      enabled: ${BATCH_ENABLED:false}

  # ===================================
  # Spring Cloud 호환성 검증 비활성화
  # ===================================
  cloud:
    compatibility-verifier:
      enabled: false

  # ===================================
  # Kafka 설정 (이벤트 스트리밍)
  # ===================================
  kafka:
    # Kafka 브로커 주소
    # 로컬: localhost:9092
    # Docker: novel-kafka:29092
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    
    # Producer 설정
    producer:
      # Key/Value 직렬화 방식 (문자열)
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      
      # acks: 메시지 전송 확인 정책
      # - all: 모든 복제본이 받을 때까지 대기 (안정성 최대)
      # - 1: 리더 파티션만 받으면 성공 (균형)
      # - 0: 전송 후 응답 대기 안함 (성능 최대)
      acks: all
    
    # Consumer 설정
    consumer:
      # Consumer Group ID
      group-id: ${KAFKA_GROUP_ID:novel-insight-group}
      
      # Key/Value 역직렬화 방식
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      
      # auto-offset-reset: 오프셋이 없을 때 동작
      # - earliest: 토픽의 처음부터 읽기
      # - latest: 최신 메시지부터 읽기
      auto-offset-reset: earliest

# ===================================
# JWT 토큰 설정 (커스텀 프로퍼티)
# ===================================
jwt:
  # [보안] JWT 서명 비밀키 (최소 32자 이상 권장)
  # 환경변수로 반드시 주입받아야 합니다 (기본값: 개발용)
  # 예: openssl rand -base64 32
  # ⚠️ 프로덕션에서는 반드시 환경변수로 안전한 키를 설정하세요!
  secret: ${JWT_SECRET:dev-secret-key-minimum-32-characters-long-for-hs256}

  # JWT 발급자 (Issuer)
  issuer: ${JWT_ISSUER:novel-insight}

  # ===================================
  # 실무 권장 토큰 유효기간 (Production Best Practices)
  # ===================================
  # Access Token: 짧게 유지 (15분 ~ 1시간)
  # - 이유: 탈취되어도 피해 최소화 (자동 만료)
  # - XSS 공격 시에도 짧은 시간만 악용 가능
  # - 짧을수록 안전하지만, 너무 짧으면 사용자 불편
  access-duration-hour: ${JWT_ACCESS_DURATION_HOUR:1}

  # Refresh Token: 길게 유지 (7일 ~ 30일)
  # - 이유: 사용자가 자주 로그인하지 않아도 됨 (편의성)
  # - HttpOnly Cookie + DB 저장으로 보안 강화
  # - 탈취 감지 시 즉시 무효화 가능 (DB 제어)
  refresh-duration-day: ${JWT_REFRESH_DURATION_DAY:14}

# ===================================
# Python 분석 서비스 설정 (커스텀 프로퍼티)
# ===================================
python:
  service:
    # FastAPI 분석 서비스 URL
    url: ${PYTHON_SERVICE_URL:http://localhost:8000}

# ===================================
# 서버 설정
# ===================================
server:
  port: ${SERVER_PORT:8080}

# ===================================
# Actuator + Prometheus 설정 (Phase 4)
# ===================================
management:
  # Actuator 엔드포인트 설정
  endpoints:
    web:
      exposure:
        # 노출할 엔드포인트 (보안 주의!)
        # - health: 헬스 체크
        # - prometheus: Prometheus 메트릭 수집
        # - metrics: Micrometer 메트릭
        # - info: 애플리케이션 정보
        include: health,prometheus,metrics,info

      # Actuator 엔드포인트 기본 경로
      base-path: /actuator

  # 헬스 체크 상세 정보 노출
  endpoint:
    health:
      show-details: always  # always: 모든 사용자에게 상세 정보 표시

  # 메트릭 설정
  metrics:
    # Tag 추가 (메트릭 필터링용)
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}

    # Prometheus 포맷으로 메트릭 수집
    export:
      prometheus:
        enabled: true

    # JVM 메트릭 활성화
    enable:
      jvm: true
      process: true
      system: true
      tomcat: true
      logback: true
      kafka: true

# ===================================
# 로깅 설정
# ===================================
logging:
  level:
    # 루트 로거 레벨
    root: ${LOGGING_LEVEL:INFO}
    
    # Hibernate SQL 로그 (show-sql과 별개)
    org.hibernate.SQL: ${LOGGING_LEVEL:DEBUG}
    
    # Hibernate SQL 파라미터 로그
    org.hibernate.type.descriptor.sql: ${LOGGING_LEVEL:TRACE}
    
    # 애플리케이션 패키지 로그
    com.sparta.novel_insight: ${LOGGING_LEVEL:DEBUG}
  
  # 로그 파일 설정 (선택사항)
  file:
    name: ${LOG_FILE:logs/novel-insight.log}
    max-size: 10MB
    max-history: 30
