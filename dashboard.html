<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Insight - 작가 대시보드</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .loading {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <!-- 헤더 -->
        <div class="mb-8 text-white">
            <h1 class="text-4xl font-bold mb-2">📚 Novel Insight</h1>
            <p class="text-lg opacity-90">작가 대시보드 - 실시간 독자 분석</p>
        </div>

        <!-- 작가 선택 -->
        <div class="card p-6 mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">작가 선택</label>
            <div class="flex gap-4">
                <input type="number" id="authorId" placeholder="작가 ID 입력" value="1"
                    class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                <button onclick="loadDashboard()"
                    class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors font-medium">
                    대시보드 로드
                </button>
            </div>
        </div>

        <!-- 로딩 인디케이터 -->
        <div id="loading" class="hidden flex justify-center items-center py-20">
            <div class="loading"></div>
        </div>

        <!-- 대시보드 콘텐츠 -->
        <div id="dashboard" class="hidden space-y-6">
            <!-- 주요 지표 카드 -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="stat-card p-6 rounded-lg">
                    <div class="text-white text-opacity-80 text-sm mb-1">총 조회수</div>
                    <div id="totalViews" class="text-3xl font-bold">0</div>
                    <div class="text-white text-opacity-60 text-xs mt-2">최근 30일</div>
                </div>
                <div class="stat-card p-6 rounded-lg">
                    <div class="text-white text-opacity-80 text-sm mb-1">고유 독자</div>
                    <div id="uniqueReaders" class="text-3xl font-bold">0</div>
                    <div class="text-white text-opacity-60 text-xs mt-2">세션 기준</div>
                </div>
                <div class="stat-card p-6 rounded-lg">
                    <div class="text-white text-opacity-80 text-sm mb-1">완독률</div>
                    <div id="completionRate" class="text-3xl font-bold">0%</div>
                    <div class="text-white text-opacity-60 text-xs mt-2">90% 이상 기준</div>
                </div>
                <div class="stat-card p-6 rounded-lg">
                    <div class="text-white text-opacity-80 text-sm mb-1">평균 읽기 시간</div>
                    <div id="avgReadingTime" class="text-3xl font-bold">0분</div>
                    <div class="text-white text-opacity-60 text-xs mt-2">에피소드당</div>
                </div>
            </div>

            <!-- 감성 분석 & 종합 점수 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="card p-6">
                    <h3 class="text-xl font-bold mb-4 text-gray-800">📊 감성 분석 (Phase 5)</h3>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">총 리뷰</span>
                            <span id="totalReviews" class="font-bold">0개</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">긍정 비율</span>
                            <div class="flex items-center gap-2">
                                <div class="w-24 bg-gray-200 rounded-full h-2">
                                    <div id="positiveBar" class="bg-green-500 h-2 rounded-full" style="width: 0%"></div>
                                </div>
                                <span id="positiveRate" class="font-bold text-green-600">0%</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600">부정 비율</span>
                            <div class="flex items-center gap-2">
                                <div class="w-24 bg-gray-200 rounded-full h-2">
                                    <div id="negativeBar" class="bg-red-500 h-2 rounded-full" style="width: 0%"></div>
                                </div>
                                <span id="negativeRate" class="font-bold text-red-600">0%</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card p-6">
                    <h3 class="text-xl font-bold mb-4 text-gray-800">🏆 종합 품질 점수</h3>
                    <div class="flex items-center justify-center">
                        <div class="relative w-48 h-48">
                            <canvas id="insightScoreChart"></canvas>
                            <div class="absolute inset-0 flex items-center justify-center">
                                <div class="text-center">
                                    <div id="insightScore" class="text-4xl font-bold text-purple-600">0</div>
                                    <div class="text-sm text-gray-500">/ 100</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <p class="text-xs text-gray-500 text-center mt-4">
                        완독률(40%) + 긍정률(30%) + 기쁨(20%) - 분노(10%)
                    </p>
                </div>
            </div>

            <!-- 트렌드 차트 -->
            <div class="card p-6">
                <h3 class="text-xl font-bold mb-4 text-gray-800">📈 최근 30일 트렌드</h3>
                <canvas id="trendChart" height="100"></canvas>
            </div>

            <!-- 베스트/워스트 에피소드 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="card p-6">
                    <h3 class="text-xl font-bold mb-4 text-gray-800">🌟 베스트 에피소드 TOP 5</h3>
                    <div id="bestEpisodes" class="space-y-2">
                        <!-- 동적 생성 -->
                    </div>
                </div>

                <div class="card p-6">
                    <h3 class="text-xl font-bold mb-4 text-gray-800">⚠️ 개선 필요 에피소드</h3>
                    <div id="worstEpisodes" class="space-y-2">
                        <!-- 동적 생성 -->
                    </div>
                </div>
            </div>

            <!-- 이탈 지점 분석 -->
            <div class="card p-6">
                <h3 class="text-xl font-bold mb-4 text-gray-800">🎯 에피소드 이탈 지점 분석</h3>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">에피소드 ID</label>
                    <input type="number" id="episodeId" placeholder="에피소드 ID 입력" value="1"
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    <button onclick="loadDropOffAnalysis()"
                        class="ml-2 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                        분석하기
                    </button>
                </div>
                <canvas id="dropOffChart" height="80"></canvas>
                <div id="dropOffRecommendation" class="mt-4 p-4 bg-yellow-50 border-l-4 border-yellow-400 hidden">
                    <p class="text-sm text-yellow-800"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API Base URL
        const API_BASE = 'http://localhost:8080/api';

        let trendChart, dropOffChart, insightScoreChart;

        // 대시보드 로드
        async function loadDashboard() {
            const authorId = document.getElementById('authorId').value;

            if (!authorId) {
                alert('작가 ID를 입력하세요.');
                return;
            }

            showLoading(true);

            try {
                // 작가 대시보드 조회
                const response = await fetch(`${API_BASE}/dashboard/author/${authorId}`);

                if (!response.ok) {
                    throw new Error('대시보드 데이터를 불러올 수 없습니다.');
                }

                const data = await response.json();

                // 주요 지표 업데이트
                document.getElementById('totalViews').textContent = data.totalViews.toLocaleString();
                document.getElementById('uniqueReaders').textContent = data.uniqueReaders.toLocaleString();
                document.getElementById('completionRate').textContent = data.completionRate + '%';
                document.getElementById('avgReadingTime').textContent = data.avgReadingTimeMinutes + '분';

                // 감성 분석
                document.getElementById('totalReviews').textContent = data.totalReviews.toLocaleString() + '개';
                document.getElementById('positiveRate').textContent = data.positiveRate + '%';
                document.getElementById('negativeRate').textContent = data.negativeRate + '%';
                document.getElementById('positiveBar').style.width = data.positiveRate + '%';
                document.getElementById('negativeBar').style.width = data.negativeRate + '%';

                // 종합 점수
                document.getElementById('insightScore').textContent = Math.round(data.insightScore);
                updateInsightScoreChart(data.insightScore);

                // 트렌드 로드
                await loadTrend(authorId);

                // 베스트/워스트 에피소드 로드
                await loadBestWorstEpisodes(authorId);

                showLoading(false);
                document.getElementById('dashboard').classList.remove('hidden');
            } catch (error) {
                console.error('Error loading dashboard:', error);
                alert('대시보드 로드 실패: ' + error.message);
                showLoading(false);
            }
        }

        // 트렌드 차트 로드
        async function loadTrend(authorId) {
            try {
                const response = await fetch(`${API_BASE}/dashboard/author/${authorId}/trend?limit=30`);
                const data = await response.json();

                const labels = data.map(d => d.aggregatedDate);
                const views = data.map(d => d.totalViews);
                const completion = data.map(d => d.completionRate);

                if (trendChart) {
                    trendChart.destroy();
                }

                const ctx = document.getElementById('trendChart');
                trendChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: '조회수',
                                data: views,
                                borderColor: '#667eea',
                                backgroundColor: 'rgba(102, 126, 234, 0.1)',
                                yAxisID: 'y',
                            },
                            {
                                label: '완독률 (%)',
                                data: completion,
                                borderColor: '#f59e0b',
                                backgroundColor: 'rgba(245, 158, 11, 0.1)',
                                yAxisID: 'y1',
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        },
                        scales: {
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                grid: {
                                    drawOnChartArea: false,
                                },
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Error loading trend:', error);
            }
        }

        // 베스트/워스트 에피소드 로드
        async function loadBestWorstEpisodes(authorId) {
            try {
                // Novel ID는 실제로는 작가의 소설 목록에서 가져와야 하지만, 여기서는 1로 가정
                const novelId = 1;

                // 베스트 에피소드
                const bestResponse = await fetch(`${API_BASE}/dashboard/novels/${novelId}/episodes/best?limit=5`);
                const bestData = await bestResponse.json();

                const bestHtml = bestData.map((ep, index) => `
                    <div class="flex items-center justify-between p-3 bg-green-50 rounded-lg">
                        <div class="flex items-center gap-3">
                            <span class="w-8 h-8 bg-green-500 text-white rounded-full flex items-center justify-center font-bold">${index + 1}</span>
                            <span class="font-medium">에피소드 ${ep.episodeId}</span>
                        </div>
                        <span class="text-green-600 font-bold">${ep.completionRate}%</span>
                    </div>
                `).join('');
                document.getElementById('bestEpisodes').innerHTML = bestHtml;

                // 워스트 에피소드
                const worstResponse = await fetch(`${API_BASE}/dashboard/novels/${novelId}/episodes/worst?limit=5`);
                const worstData = await worstResponse.json();

                const worstHtml = worstData.map((ep, index) => `
                    <div class="flex items-center justify-between p-3 bg-red-50 rounded-lg">
                        <div class="flex items-center gap-3">
                            <span class="w-8 h-8 bg-red-500 text-white rounded-full flex items-center justify-center font-bold">${index + 1}</span>
                            <span class="font-medium">에피소드 ${ep.episodeId}</span>
                        </div>
                        <span class="text-red-600 font-bold">${ep.completionRate}%</span>
                    </div>
                `).join('');
                document.getElementById('worstEpisodes').innerHTML = worstHtml;
            } catch (error) {
                console.error('Error loading best/worst episodes:', error);
            }
        }

        // 이탈 지점 분석 로드
        async function loadDropOffAnalysis() {
            const episodeId = document.getElementById('episodeId').value;

            if (!episodeId) {
                alert('에피소드 ID를 입력하세요.');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/dashboard/episodes/${episodeId}/drop-off`);
                const data = await response.json();

                const labels = Object.keys(data.dropOffMap);
                const values = Object.values(data.dropOffMap);

                if (dropOffChart) {
                    dropOffChart.destroy();
                }

                const ctx = document.getElementById('dropOffChart');
                dropOffChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '이탈자 수',
                            data: values,
                            backgroundColor: 'rgba(239, 68, 68, 0.5)',
                            borderColor: 'rgba(239, 68, 68, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });

                // 추천 표시
                const recommendation = document.getElementById('dropOffRecommendation');
                recommendation.querySelector('p').textContent = data.recommendation;
                recommendation.classList.remove('hidden');
            } catch (error) {
                console.error('Error loading drop-off analysis:', error);
                alert('이탈 지점 분석 실패: ' + error.message);
            }
        }

        // 종합 점수 차트 업데이트
        function updateInsightScoreChart(score) {
            if (insightScoreChart) {
                insightScoreChart.destroy();
            }

            const ctx = document.getElementById('insightScoreChart');
            insightScoreChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [score, 100 - score],
                        backgroundColor: ['#667eea', '#e5e7eb'],
                        borderWidth: 0
                    }]
                },
                options: {
                    cutout: '80%',
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        // 로딩 표시/숨김
        function showLoading(show) {
            document.getElementById('loading').classList.toggle('hidden', !show);
            document.getElementById('dashboard').classList.toggle('hidden', show);
        }

        // 페이지 로드 시 자동 로드
        window.addEventListener('load', () => {
            // 자동 로드 (옵션)
            // loadDashboard();
        });
    </script>
</body>
</html>
