version: '3.8'

services:
  novel-mysql:
    image: mysql:8.0
    container_name: novel-mysql-container
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234!
      MYSQL_DATABASE: novel_insight
      MYSQL_USER: novel_user
      MYSQL_PASSWORD: novel1234!
      TZ: Asia/Seoul
    volumes:
      - ./data/mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - novel-net

  # ▼▼▼ [도영 님이 작성할 부분] ▼▼▼
  novel-redis:
    image: redis:alpine
    container_name: novel-redis-container
    ports:
      - "6379:6379"
    networks:
      - novel-net
  ### 여기를 채우세요 (image, container_name, ports, networks 필요) ###

  novel-rabbitmq:
    image: rabbitmq:management # 관리자 화면(Web UI)이 포함된 버전
    container_name: novel-rabbitmq-container
    ports:
      - "5672:5672"   # 자바랑 통신하는 포트
      - "15672:15672" # 관리자 웹 페이지 포트
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - novel-net

  # ========================================
  # ★★★ Kafka 인프라 (로그 파이프라인용) ★★★
  # ========================================

  # 1️⃣ Zookeeper: Kafka 브로커들을 관리하는 "교통경찰"
  novel-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0  # Confluent 공식 이미지 (가장 안정적)
    container_name: novel-zookeeper-container
    ports:
      - "2181:2181"  # Zookeeper 기본 포트 (Kafka가 이 포트로 접속함)
    environment:
      # Zookeeper의 "사원 번호" (단일 서버는 1번)
      ZOOKEEPER_CLIENT_PORT: 2181
      # 하트비트 체크 간격 (2초마다 "살아있니?" 확인)
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - novel-net

  # 2️⃣ Kafka: 메시지를 저장하는 "고속도로 휴게소"
  # ▼▼▼ [도영 님이 작성할 부분] ▼▼▼
  novel-kafka:
    image: confluentinc/cp-kafka:7.5.0  # Zookeeper와 같은 버전 사용 (호환성)
    container_name: novel-kafka-container
    # 힌트 1: ports는 2개 필요 (9092: 외부 접속용, 29092: Docker 내부용)
    ports:
      - "9092:9092"   # ← 외부 접속용 (내 PC → Kafka)
      - "29092:29092" # ← Docker 내부용 (Python 컨테이너 → Kafka)

    # 힌트 2: depends_on (Zookeeper가 먼저 떠야 함)
    depends_on:
      - novel-zookeeper  # ← Kafka는 Zookeeper 없이 못 뜸!

    environment:
      # [중요] Kafka 브로커 ID (여러 대 띄울 때 구분용, 단일 서버는 1번)
      KAFKA_BROKER_ID: 1

      # [필수] Zookeeper 주소 (Kafka가 "교통경찰"에게 보고하는 주소)
      KAFKA_ZOOKEEPER_CONNECT: "novel-zookeeper:2181"

      # [중요] 리스너 설정 (접속 경로 2가지)
      # - PLAINTEXT: Docker 내부 통신용 (Python ↔ Kafka)
      # - PLAINTEXT_HOST: 외부 접속용 (내 PC ↔ Kafka)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://novel-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # [성능] 오프셋 파티션 개수 (로그 분산 저장 - 기본 1개)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    # 힌트 3: networks (다른 서비스들과 같은 네트워크 사용)
    networks:
      - novel-net  # ← MySQL, Redis, RabbitMQ와 같은 네트워크 (서로 통신 가능!)

  # ========================================
  # ★★★ Python 분석 서비스 (Kafka Consumer + 감성 분석) ★★★
  # ========================================
  python-service:
    build: ./python-service  # Dockerfile 위치
    container_name: python-service-container
    ports:
      - "8000:8000"  # FastAPI 포트
    depends_on:
      - novel-kafka  # Kafka가 먼저 떠야 Consumer가 연결 가능
    networks:
      - novel-net
    environment:
      - PYTHONUNBUFFERED=1  # 로그 즉시 출력

networks:
  novel-net:
    driver: bridge