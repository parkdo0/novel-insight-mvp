# ===================================
# Prometheus Configuration (Phase 4)
# ===================================
# Prometheus 메트릭 수집 서버 설정
#
# 주요 역할:
# 1. Spring Boot Actuator에서 메트릭 수집 (/actuator/prometheus)
# 2. 메트릭 저장 (시계열 데이터베이스)
# 3. Grafana에 데이터 제공 (PromQL 쿼리)
#
# 설정 구조:
# - global: 전역 설정 (스크래핑 간격, 타임아웃 등)
# - scrape_configs: 메트릭 수집 대상 정의
# ===================================

# ===================================
# 전역 설정
# ===================================
global:
  # 메트릭 수집 간격 (기본값: 1분)
  # WHY 15초?
  # - 짧을수록 실시간성 향상, 디스크 사용량 증가
  # - 15초는 적절한 균형 (실시간 모니터링 + 리소스 절약)
  # - Production: 30초 또는 1분 권장
  scrape_interval: 15s

  # 메트릭 수집 타임아웃 (수집 간격보다 짧아야 함)
  scrape_timeout: 10s

  # 외부 라벨 (모든 메트릭에 추가)
  # 여러 Prometheus 서버 운영 시 구분용
  external_labels:
    monitor: 'novel-insight-monitor'
    environment: 'local'

# ===================================
# 메트릭 수집 대상 (Scrape Configs)
# ===================================
scrape_configs:
  # -----------------------------------
  # 1. Prometheus 자체 메트릭
  # -----------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    # Prometheus 자체의 메트릭 수집
    # - prometheus_tsdb_*: 시계열 DB 상태
    # - prometheus_rule_*: 알림 규칙 실행 상태
    # - prometheus_target_*: 수집 대상 상태

  # -----------------------------------
  # 2. Spring Boot Application (Novel Insight)
  # -----------------------------------
  - job_name: 'novel-insight'

    # 메트릭 수집 경로
    metrics_path: '/actuator/prometheus'

    # 수집 대상 (Spring Boot 애플리케이션)
    static_configs:
      - targets: ['host.docker.internal:8080']
        # WHY host.docker.internal?
        # - Docker 컨테이너에서 호스트 머신의 localhost에 접근
        # - Spring Boot는 호스트에서 실행 (포트 8080)
        # - Prometheus는 Docker 컨테이너에서 실행
        #
        # 대안 (Spring Boot도 Docker화 시):
        # - targets: ['novel-insight-container:8080']

        # 라벨 추가 (메트릭 필터링용)
        labels:
          application: 'novel-insight'
          instance: 'localhost'
          environment: 'local'

    # 수집 간격 (global 설정 덮어쓰기)
    scrape_interval: 15s
    scrape_timeout: 10s

# ===================================
# 알림 규칙 (선택사항, 향후 확장)
# ===================================
# rule_files:
#   - 'alerts/*.yml'
#
# 알림 예시:
# - API 응답 시간 > 1초
# - CPU 사용률 > 80%
# - 메모리 사용률 > 90%
# - Kafka Consumer Lag > 1000

# ===================================
# Alertmanager 설정 (선택사항, 향후 확장)
# ===================================
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']
#
# 알림 전송:
# - Slack, Email, PagerDuty 등
# - 알림 그룹화, 중복 제거, 침묵 처리

# ===================================
# 주요 메트릭 카테고리
# ===================================
# Spring Boot Actuator가 제공하는 메트릭:
#
# 1. JVM 메트릭
#    - jvm_memory_used_bytes: JVM 메모리 사용량
#    - jvm_gc_pause_seconds: GC 일시 정지 시간
#    - jvm_threads_live: 실행 중인 스레드 수
#
# 2. 시스템 메트릭
#    - system_cpu_usage: CPU 사용률
#    - process_uptime_seconds: 애플리케이션 업타임
#    - system_load_average_1m: 시스템 부하
#
# 3. HTTP 메트릭
#    - http_server_requests_seconds: API 응답 시간
#    - http_server_requests_seconds_count: API 호출 횟수
#    - http_server_requests_seconds_sum: API 총 응답 시간
#
# 4. Tomcat 메트릭
#    - tomcat_sessions_active_current: 활성 세션 수
#    - tomcat_threads_busy: Tomcat 바쁜 스레드 수
#
# 5. Kafka 메트릭 (Spring Kafka)
#    - kafka_producer_*: Producer 메트릭
#    - kafka_consumer_*: Consumer 메트릭
#
# 6. 커스텀 메트릭 (Phase 4 추가)
#    - notification_sent_total: 알림 발송 총 횟수
#    - notification_failed_total: 알림 발송 실패 횟수
#    - kafka_messages_sent_total: Kafka 메시지 전송 횟수

# ===================================
# Grafana 대시보드 추천 쿼리 (PromQL)
# ===================================
#
# 1. API 평균 응답 시간 (1분 평균)
# rate(http_server_requests_seconds_sum[1m]) / rate(http_server_requests_seconds_count[1m])
#
# 2. API 초당 요청 수 (RPS)
# rate(http_server_requests_seconds_count[1m])
#
# 3. JVM 메모리 사용률
# (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100
#
# 4. CPU 사용률
# system_cpu_usage * 100
#
# 5. 알림 발송 성공률
# (notification_sent_total - notification_failed_total) / notification_sent_total * 100
#
# 6. Kafka 메시지 전송 속도
# rate(kafka_messages_sent_total[1m])

# ===================================
# 문제 해결
# ===================================
#
# 1. Prometheus가 Spring Boot에 연결 안 됨
#    - host.docker.internal이 작동하지 않으면:
#      - Windows/Mac: Docker Desktop 설정 확인
#      - Linux: --add-host=host.docker.internal:host-gateway
#    - 또는 Spring Boot를 Docker화하여 같은 네트워크 사용
#
# 2. 메트릭이 수집되지 않음
#    - Spring Boot Actuator 엔드포인트 확인:
#      curl http://localhost:8080/actuator/prometheus
#    - Prometheus 타겟 상태 확인:
#      http://localhost:9090/targets
#
# 3. Prometheus UI 접속
#    - http://localhost:9090
#    - Status > Targets: 수집 대상 상태 확인
#    - Graph: PromQL 쿼리 테스트
